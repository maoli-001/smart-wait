# 智能候诊系统配置
server:
  # 默认 8080；若本机 8080/8081 被占用（如课程机房环境），可改为 8099 等空闲端口
  port: 8099

spring:
  application:
    name: smart-wait
  datasource:
    # H2 内嵌文件数据库：零安装、单文件（./data/smartwait.mv.db），答辩现场直接运行
    url: jdbc:h2:file:./data/smartwait;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      # H2 控制台：http://localhost:8080/h2-console（JDBC URL 同上）
      enabled: true
      path: /h2-console

logging:
  level:
    com.hospital.smartwait: info
